# ============================================================================
# Account Mapping Page — locator templates
# Used by: elements.exapmlepages.AccountMappingElements
# ============================================================================

# --- Header / ReadOnly labels ---
PAGE_TITLE          = //h1[contains(@class,'page-title')]
BREADCRUMB          = //nav[@aria-label='breadcrumb']//li[last()]
LAST_SYNCED_LABEL   = //span[@data-testid='last-synced']

# --- SearchField (search bar) ---
SEARCH_INPUT        = //input[@placeholder='Search accounts...']
SEARCH_BUTTON       = //button[@aria-label='Search']

# --- FilterPanel > StatusDropdown (SearchableDropdown) ---
STATUS_TRIGGER      = //mat-select[@formcontrolname='status']
STATUS_SEARCH_INPUT = //input[@placeholder='Filter statuses...']
STATUS_SEARCH_BTN   = //button[@aria-label='Apply status filter']
STATUS_RESULTS      = //mat-option[span[contains(text(),'%s')]]

# --- FilterPanel > DateRange (TextInputField) ---
DATE_FROM_INPUT     = //input[@formcontrolname='dateFrom']
DATE_TO_INPUT       = //input[@formcontrolname='dateTo']

# --- FilterPanel > ActiveOnly (Checkbox) ---
ACTIVE_ONLY_TRIGGER = //mat-checkbox[@formcontrolname='activeOnly']

# --- FilterPanel > ApplyButton (Clickable) ---
APPLY_FILTER_TRIGGER = //button[span[normalize-space()='Apply']]
RESET_FILTER_TRIGGER = //button[span[normalize-space()='Reset']]

# --- AccountTable (WritableTableElement) ---
ACCT_TABLE          = //table[@id='account-mapping-grid']
ACCT_ROW            = //table[@id='account-mapping-grid']//tbody/tr[%s]
ACCT_COLUMN         = //table[@id='account-mapping-grid']//tbody/tr/td[%s]
ACCT_CELL           = //table[@id='account-mapping-grid']//tbody/tr[%s]/td[%s]
ACCT_HEADER         = //table[@id='account-mapping-grid']//thead/th[%s]
ACCT_ADD_ROW        = //button[@data-testid='add-mapping-row']
ACCT_REMOVE_ROW     = //button[@data-testid='remove-row-%s']
ACCT_FOOTER_INPUT   = //table[@id='account-mapping-grid']//tfoot//input[%s]

# --- AccountTable > InlineEditor (TextInputField nested inside table) ---
INLINE_EDIT_INPUT   = //tr[@data-row='%s']//input[@data-col='%s']

# --- ActionBar > BulkActions (Dropdown) ---
BULK_ACTION_TRIGGER  = //button[@id='bulk-actions-btn']
BULK_ACTION_LIST     = //ul[@role='menu']//li[normalize-space()='%s']

# --- ActionBar > ExportButton (Clickable) ---
EXPORT_TRIGGER       = //button[@data-testid='export-btn']

# --- DetailPanel > TooltipField (ToolTipElement) ---
ACCOUNT_NAME_TEXT        = .//span[@class='acct-name truncate']
ACCOUNT_NAME_TOOLTIP     = //div[@class='cdk-overlay-container']//div[contains(@class,'tooltip')]

# --- DetailPanel > RoleSelector (MultipleIdenticalDropdowns) ---
ROLE_MULTI_TRIGGER   = (//mat-select[@formcontrolname='role'])[%s]
ROLE_MULTI_LIST      = //mat-option[span[contains(text(),'%s')]]

# --- DetailPanel > FileUpload (FileInputElement) ---
UPLOAD_INPUT         = //input[@type='file' and @data-testid='mapping-upload']

# --- Pagination (Clickable, nested) ---
NEXT_PAGE_TRIGGER    = //button[@aria-label='Next page']
PREV_PAGE_TRIGGER    = //button[@aria-label='Previous page']
PAGE_SIZE_TRIGGER    = //mat-select[@aria-label='Items per page']
PAGE_SIZE_LIST       = //mat-option[span[text()='%s']]

