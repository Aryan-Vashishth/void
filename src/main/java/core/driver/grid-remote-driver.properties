# ---- Core ----
browser=chrome
remote=true
gridUrl=http://localhost:4444/wd/hub
maximize=true

# ---- Timeouts (seconds) ----
implicitWait=5
pageLoadTimeout=60
scriptTimeout=30
pageLoadStrategy=NORMAL

# ---- Capabilities (common Selenoid/Grid flags) ----
cap.enableVNC=true
cap.enableVideo=false
cap.name=SmokeSuite

# ---- Extra args ----
args=--disable-notifications,--lang=en-US

# ---- Downloads (often not used on Grid; leave out unless your infra supports it) ----
# downloadsDir=/tmp/downloads
