# ---- Core ----
# browser: chrome | firefox | edge
browser=chrome
remote=false
maximize=true
# choose one strategy:
# 1) maximize only: (no size)
# 2) fixed size (disable maximize):
# maximize=false
# width=1366
# height=768

# ---- Timeouts (seconds) ----
implicitWait=5
pageLoadTimeout=45
scriptTimeout=20
pageLoadStrategy=NORMAL

# ---- Downloads ----
downloadsDir=/tmp/downloads

# ---- Proxy (optional; remove if unused) ----
# proxy.http=localhost:8080
# proxy.ssl=localhost:8080

# ---- Extra args (pick one style) ----
args=--disable-notifications,--lang=en-US
# arg.1=--window-position=0,0
