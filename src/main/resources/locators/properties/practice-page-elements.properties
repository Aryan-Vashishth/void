# ==========================================
# Practice Page Elements Locators
# https://testautomationpractice.blogspot.com/
# ==========================================

# ------------------------------------------
# Page Header
# ------------------------------------------
PAGE_HEADING = //h2[contains(@class,'post-title')]

# ------------------------------------------
# Form – Text Inputs
# ------------------------------------------
NAME_INPUT    = //input[@id='name']
PHONE_INPUT   = //input[@id='phone']
EMAIL_INPUT   = //input[@id='email']
ADDRESS_INPUT = //textarea[@id='textarea']

# ------------------------------------------
# Form – Gender Radio Buttons
# ------------------------------------------
GENDER_MALE_RADIO   = //input[@type='radio' and @value='male']
GENDER_FEMALE_RADIO = //input[@type='radio' and @value='female']

# ------------------------------------------
# Form – Days Checkboxes
# ------------------------------------------
CHECKBOX_MONDAY    = //input[@id='monday']
CHECKBOX_TUESDAY   = //input[@id='tuesday']
CHECKBOX_WEDNESDAY = //input[@id='wednesday']
CHECKBOX_THURSDAY  = //input[@id='thursday']
CHECKBOX_FRIDAY    = //input[@id='friday']
CHECKBOX_SATURDAY  = //input[@id='saturday']
CHECKBOX_SUNDAY    = //input[@id='sunday']

# ------------------------------------------
# Form – Country Native Select Dropdown
# ------------------------------------------
COUNTRY_TRIGGER = //select[@id='country']
COUNTRY_LIST    = //select[@id='country']/option[normalize-space(text())='%s']

# ------------------------------------------
# Form – Colors Bootstrap Dropdown
# ------------------------------------------
COLORS_TRIGGER = //button[@id='colors']
COLORS_LIST    = //ul[contains(@class,'dropdown-menu')]//a[normalize-space(text())='%s']

# ------------------------------------------
# Form – Date Picker
# ------------------------------------------
DATE_PICKER_INPUT = //input[@id='datepicker']

# ------------------------------------------
# Form – Submit / Reset Buttons
# ------------------------------------------
SUBMIT_BUTTON = //input[@type='submit' and @value='Submit']
RESET_BUTTON  = //input[@type='reset'  and @value='Reset']

# ------------------------------------------
# Alert / Dialog Buttons
# ------------------------------------------
ALERT_BUTTON   = //button[normalize-space(text())='Alert']
CONFIRM_BUTTON = //button[normalize-space(text())='Confirm Box']
PROMPT_BUTTON  = //button[normalize-space(text())='Prompt Box']

# ------------------------------------------
# jQuery Search / Autocomplete
# ------------------------------------------
SEARCH_INPUT  = //input[@id='autocomplete']
SEARCH_LIST   = //ul[contains(@class,'ui-autocomplete')]//li[normalize-space(text())='%s']

# ------------------------------------------
# HTML Table
# ------------------------------------------
TABLE_CONTAINER  = //table[@name='BookTable']
TABLE_ROW        = //table[@name='BookTable']//tr[td]
TABLE_HEADER     = //table[@name='BookTable']//th[normalize-space(text())='%s']
TABLE_CELL       = //table[@name='BookTable']//tr[td[normalize-space(text())='%s']]

# ------------------------------------------
# Drag and Drop
# ------------------------------------------
DRAG_SOURCE = //div[@id='draggable']
DROP_TARGET = //div[@id='droppable']

# ------------------------------------------
# Double-Click Button
# ------------------------------------------
DOUBLE_CLICK_BUTTON = //button[@id='dblClkBtn']
DOUBLE_CLICK_RESULT = //input[@id='field1']

# ------------------------------------------
# Right-Click / Context Menu
# ------------------------------------------
RIGHT_CLICK_BUTTON = //div[@id='rightclickbtn']
CONTEXT_MENU       = //ul[@id='myMenu']

# ------------------------------------------
# iFrame
# ------------------------------------------
IFRAME_CONTAINER = //iframe[@id='iframe1' or @name='iframe1']
IFRAME_TEXT_BODY = //body

# ------------------------------------------
# New Browser Tab / Window
# ------------------------------------------
NEW_TAB_BUTTON = //button[normalize-space(text())='New Browser Tab']

# ------------------------------------------
# Web Table (dynamic) – second table
# ------------------------------------------
WEB_TABLE_CONTAINER = //table[@id='productTable']
WEB_TABLE_ROW       = //table[@id='productTable']//tr[td]
WEB_TABLE_HEADER    = //table[@id='productTable']//th[normalize-space(text())='%s']
WEB_TABLE_CELL      = //table[@id='productTable']//tr[td[normalize-space(text())='%s']]

# ------------------------------------------
# Key Press Input
# ------------------------------------------
KEY_PRESS_INPUT  = //input[@id='field2']
KEY_PRESS_RESULT = //p[@id='keypressResult']

