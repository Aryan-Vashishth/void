# Filter By Input Text Boxes
FILTER_BY_INPUT = //input[@data-placeholder='%s']

# Filter By Toggles
FILTER_BY_TOGGLE = //*[@formcontrolname='filterShow%s']

# User Type Dropdown
USER_TYPE_TRIGGER = //*[@formcontrolname='filterUserType']
USER_TYPE_LIST = //*[@role='option'][span[text()='%s']]

# Filter By Search Button
FILTER_BY_SEARCH_BUTTON = //button[span[text()='Apply Filter'] and not(ancestor::*[@class='category-footer'])]

# User tile container
CONTAINER = //div[contains(@class,'column-prr')]

# Individual fields within the tile
FULL_NAME = .//h2
USERNAME = .//p[text()='Username']/following-sibling::*[1]
EMAIL = .//p[text()='Email']/following-sibling::a[starts-with(@href,'mailto:')]
COMPANY = .//p[normalize-space()='Company']/following-sibling::h3
USER_TYPE = .//span[contains(@class,'sponsored-label ng')]
TOOLTIP = //div[@class='cdk-overlay-container']

# Login As button (also reused in LoginAsButton enum)
LOGIN_AS_BUTTON = .//button[contains(@class,'login-btn')]

SELECT_USER_ROLES = //input[contains(normalize-space(@placeholder),'Search this list')]
SEARCH_RESULT_LOCATOR = //mat-option[span[contains(normalize-space(text()),'%s')]]

LAYOUT_SWITCHER = //mat-button-toggle[@value ='%s']/button

