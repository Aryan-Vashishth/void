name: CI

on:
  push:
  pull_request:

jobs:

  backend-tests:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run unit tests
        run: mvn -B test -Dvoid.rootLogLevel=WARN

      - name: Upload framework logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: void-logs
          path: logs/
          if-no-files-found: ignore
