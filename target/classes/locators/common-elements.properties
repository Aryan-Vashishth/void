#Vartopia Switcher
SWITCHER_TRIGGER = //button[@id='toggle-allvendor']
SWITCHER_LIST = //a[contains(@id,'Switcher_%s')]

#Navigation Bar
NAV_BAR_MODULES = //a[contains(@data-cls,'%s')]

#Breadcrumbs
BREADCRUMB_ALL_ITEMS=//app-breadcrumb//ul/li
BREADCRUMB_LAST_ITEM=(//app-breadcrumb//ul/li)[last()]
BREADCRUMB_SECOND_LAST_ITEM=(//app-breadcrumb//ul/li)[last()-1]

#Tooltips appear here when hovered
COMMON_TOOLTIP_CONTAINER=//div[@class='cdk-overlay-container']//div[@class='mat-tooltip mat-tooltip-show']

#Records Grid/Table

# 1. Entire Table (optional if needed)
GRID_TABLE = //table

# 2. Visible Data Rows Only
GRID_ROW = //table//tbody/tr[contains(@class,'main') and not(contains(@class,'hidden'))]

# 3. Column inside a specific row (relative!)
GRID_COLUMN = .//td[%s]

# 4. Specific Cell (absolute: table ? visible row[index] ? column[index])
GRID_CELL = //table//tbody/tr[contains(@class,'main') and not(contains(@class,'hidden'))][%s]/td[%s]

# 5. Table Header (if needed)
GRID_HEADER = //table//thead//th

# 6. "Search this list..." search bar
SEARCH_THIS_LIST=//input[following-sibling::span//*[contains(text(),'Search this list')]]

# 7. interactions
GRID_ACTIONS_DROPDOWNS_TRIGGER = //button[span[contains(text(),'Actions')]]
GRID_ACTIONS_DROPDOWNS_LIST = //button[contains(text(), '%s') and @role='menuitem']
ACTIONS_IMPORT_RECORDS_DROPDOWNS_TRIGGER = //button[contains(text(), 'Import Records') and @role='menuitem']
ACTIONS_IMPORT_RECORDS_DROPDOWNS_LIST = //button[contains(text(), '%s')]

# 8. Group By
GRID_GROUP_BY_DROPDOWNS_TRIGGER = //button[span[contains(text(),'Group By')]]
GRID_GROUP_BY_DROPDOWNS_LIST = //button[contains(text(), '%s') and @role='menuitem']

# 9. Bulk Update
GRID_BULK_UPDATE_DROPDOWNS_TRIGGER = //button[span[contains(text(),'Bulk Update')]]
GRID_BULK_UPDATE_DROPDOWNS_LIST = //button[contains(text(), '%s') and @role='menuitem']

# 10. Default Reports
DEFAULT_REPORTS = //ul/li[div[div[contains(text(),'%s')]]]

# 11. Three Dots Menu
# Trigger stays the same (indexed)
THREE_DOTS_MENU_TRIGGER_ACCOUNT_MAPPING=(//td[@role="cell"]/button)[%s]

# Menu option in the most recent overlay (single arg = option label)
THREE_DOTS_MENU_LIST_ACCOUNT_MAPPING=(//div[contains(@class,'cdk-overlay-pane')]//div[@role='menu']//button[@role='menuitem' and normalize-space()='%s'])[last()]

# 12. Linked Record Details
# value by its label (best for assertions)
LINKED_DIALOG_VALUE_VIA_KEY_TEXT=//label[normalize-space()='%s:']/ancestor::div[contains(@class,'col-md')][1]/following-sibling::div[1]//mat-label//text()[normalize-space() and not(ancestor::mat-icon)][1]/parent::*

LINKED_DIALOG_OTHER_CLICKABLE_ELEMENTS=//mat-icon[contains(text(),'%s')] | //button[span[contains(text(),'%s')]]










