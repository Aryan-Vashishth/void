log4j.rootCategory=DEBUG,console,rolling

# Console (keeps ANSI; message already includes stamps/callsite)
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%m%n

# Daily file for normal logs (same as console style)
log4j.appender.rolling=org.apache.log4j.DailyRollingFileAppender
log4j.appender.rolling.File=./logs/RenewalsWithAdminUser.log
log4j.appender.rolling.Append=false
log4j.appender.rolling.DatePattern='.'yyyy-MM-dd
log4j.appender.rolling.layout=org.apache.log4j.PatternLayout
log4j.appender.rolling.layout.ConversionPattern=%m%n

# External full-trace ONLY (no ANSI)
log4j.appender.tracefile=org.apache.log4j.DailyRollingFileAppender
log4j.appender.tracefile.File=./logs/full-trace.log
log4j.appender.tracefile.Append=false
log4j.appender.tracefile.DatePattern='.'yyyy-MM-dd
log4j.appender.tracefile.layout=org.apache.log4j.PatternLayout
log4j.appender.tracefile.layout.ConversionPattern=%m%n

log4j.logger.trace=INFO,tracefile
log4j.additivity.trace=false
